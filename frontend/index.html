<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Titre de l'onglet (À MODIFIER SELON TES ENVIES) -->
  <title>Journal d'Explo - Simon</title>

  <!-- Icône de l'onglet (Place ton image 'favicon.png' dans le dossier frontend) -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Polices Google -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Tailwind CSS & Styles personnalisés -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="root">

    <!-- ============ CARTE LEAFLET ============ -->
    <div id="map"></div>

    <!-- ============ NAVBAR FLOTTANTE ============ -->
    <nav class="navbar" aria-label="Navigation principale">
      <button class="nav-btn" id="btn-diary" title="Historique (Journal)" aria-label="Ouvrir le journal des visites">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/>
          <path d="M15 3v5h5"/><path d="M8 12h8M8 16h5"/>
        </svg>
      </button>

      <button class="nav-btn" id="btn-ranking" title="Classement & filtres" aria-label="Ouvrir le classement et les filtres">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M8 21h8M12 17v4"/><path d="M7 4h10v4a5 5 0 0 1-10 0Z"/>
          <path d="M7 6H4a3 3 0 0 0 3 5M17 6h3a3 3 0 0 1-3 5"/>
        </svg>
      </button>

      <button class="nav-btn" id="btn-stats" title="Mini-stats globales" aria-label="Ouvrir les statistiques globales">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 20V10M12 20V4M20 20v-7"/>
        </svg>
      </button>

      <button class="nav-btn" id="btn-theme" title="Changer de thème" aria-label="Basculer entre mode sombre et clair">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </nav>

    <!-- ============ BOUTON FLOTTANT (FAB) AJOUT SPOT ============ -->
    <button class="fab" id="btn-add-spot" title="Ajouter un spot" aria-label="Ajouter un nouveau spot">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>

    <!-- ============ DRAWER : FICHE DETAILLEE SPOT ============ -->
    <aside class="drawer" id="drawer-spot" aria-label="Fiche détaillée du spot">
      <div class="drawer-close bg-transparent p-3 flex justify-end">
        <button class="nav-btn" id="close-drawer-spot" aria-label="Fermer la fiche">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>
      <div id="spot-detail-content" class="px-5 pb-8"></div>
    </aside>

    <!-- ============ DRAWER : JOURNAL D'EXPLORATION ============ -->
    <aside class="drawer" id="drawer-diary" aria-label="Journal des visites">
      <div class="drawer-close bg-transparent p-3 flex justify-between items-center px-5">
        <h2 class="text-lg m-0">Journal d'exploration</h2>
        <button class="nav-btn" id="close-drawer-diary" aria-label="Fermer le journal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>
      <div id="diary-content" class="px-5 pb-8"></div>
    </aside>

    <!-- ============ MODALE : CLASSEMENT & FILTRES ============ -->
    <div class="modal-backdrop" id="modal-ranking">
      <div class="modal-box p-5">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg m-0">Classement & filtres</h2>
          <button class="nav-btn" id="close-ranking" aria-label="Fermer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
        </div>
        <div id="filters-bar" class="grid grid-cols-2 gap-2 mb-4"></div>
        <div id="ranking-list" class="flex flex-col gap-2"></div>
      </div>
    </div>

    <!-- ============ MODALE : MINI-STATS GLOBALES ============ -->
    <div class="modal-backdrop" id="modal-stats">
      <div class="modal-box p-5">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg m-0">Mini-stats globales</h2>
          <button class="nav-btn" id="close-stats" aria-label="Fermer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
        </div>
        <div id="stats-content"></div>
      </div>
    </div>

    <!-- ============ MODALE : AJOUT / EDITION SPOT ============ -->
    <div class="modal-backdrop" id="modal-add-spot">
      <div class="modal-box p-0">
        <div class="hazard-border-top"></div>
        <div class="p-5">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg m-0" id="add-spot-title">Nouveau spot</h2>
            <button class="nav-btn" id="close-add-spot" aria-label="Fermer">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M6 6l12 12M18 6L6 18"/>
              </svg>
            </button>
          </div>
          <form id="form-spot" class="flex flex-col gap-3"></form>
        </div>
      </div>
    </div>

    <!-- ============ LIGHTBOX PHOTO ============ -->
    <div class="lightbox hidden" id="lightbox">
      <img id="lightbox-img" src="" alt="Photo agrandie" />
    </div>

  </div>

  <!-- Scripts JS de l'application -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
